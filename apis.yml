apis:
- name: Opendatasoft OData API
  description: >-
    OData 3.0 and 4.0 compliant REST API for querying Opendatasoft datasets using standard OData query
    parameters including filtering, sorting, pagination, field selection, and full-text search. Supports
    JSON, XML, and ATOM response formats. Read-only service accessed at /api/odata relative to the platform
    hostname.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.opendatasoft.com/apis/odata/
  baseURL: https://{domain}/api/odata
