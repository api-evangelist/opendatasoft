- name: Opendatasoft Explore API v1 (Deprecated)
  description: >-
    Legacy REST API (v1) for searching datasets and records on Opendatasoft portals. Supports dataset
    search, dataset lookup, records search, records lookup, analysis, download, geo clustering, real-time
    push, and multimedia download. Deprecated — new projects should use Explore API v2.1.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.opendatasoft.com/apis/ods-search-v1/
  baseURL: https://{domain}/api/records/1.0
